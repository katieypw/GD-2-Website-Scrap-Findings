<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrap Findings</title>
    <link rel="icon" type="image/png" href="scrap-images/favicon.png">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond&family=Space+Grotesk:wght@400;600&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.adobe.com/fonts/ubuntu-mono" rel="stylesheet">


    <!-- Connect CSS file -->
    <link rel="stylesheet" href="style.css">

</head>

<body id="archive">

    <div class="page">

        <!-- LEFT SIDE -->
        <div class="left-column">

            <a href="index.html" class="menu-button">Scrap Findings</a>

            <div class="sidebar-section">

                <h4>/006</h4>

                <h3>Date Found</h3>

                <p>Approx 7:26 pm, January 29, 2026</p>





                <h3>Location</h3>
                <p>Ocad University Screen Printing Room 390</p>



                <h3>Description</h3>
               <p>Tri-Art acrylics, Tri-Art base</p>

                <p>This piece of scrap was made by me. During tests for my screenprinting project round 1. </p>
            </div>

            <a href="archive-5.html" class="back-button">←Back</a>

        </div>

        <!-- CENTER IMAGE -->
        <div class="center-column">
            <div class="scrap">
                <img class="scrap-img-3" src="scrap-images/scrap-6.png" alt="Scrap Image">
            <img class="scrap-img-3" src="scrap-images/scrap-6-1.png" alt="Scrap Image">
            
            </div>
        </div>

        <!-- RIGHT SIDE -->
        <div class="right-column">
            <div class="hover-box">
                <button class="info-toggle" id="audioBtn">+</button>

                <audio id="archiveAudio">
                    <source src="audio/branches rubbing.m4a" type="audio/mp4">
                </audio>
                <p class="sound-label">sound</p>
            </div>
        </div>

        <a href="archive-7.html" class="next-button">Next →</a>
    </div>

    </div>

    <script>
        function toggleInfo() {
            document.getElementById("related").classList.toggle("active");
        }

        // Audio play on + button click
        document.addEventListener('DOMContentLoaded', function () {
            const audioBtn = document.getElementById('audioBtn');
            const archiveAudio = document.getElementById('archiveAudio');

            if (audioBtn && archiveAudio) {
                audioBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    if (archiveAudio.paused) {
                        archiveAudio.play();
                    } else {
                        archiveAudio.pause();
                    }
                });
            }
        });

        // Keyboard navigation for back/next buttons
        document.addEventListener('keydown', function (e) {
            const backBtn = document.querySelector('.back-button');
            const nextBtn = document.querySelector('.next-button');

            if (e.key === 'ArrowLeft' && backBtn) {
                e.preventDefault();
                backBtn.click();
            } else if (e.key === 'ArrowRight' && nextBtn) {
                e.preventDefault();
                nextBtn.click();
            }
        });
    </script>

</body>

</html>
